<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>目標理財規劃器</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a24;--mu:#66756d;--ac:#0f7b5f;--ac2:#e0f3ec;--bd:#dde3de;--ok:#0f7b5f;--warn:#b7791f;--bad:#c0392b;--tg:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1a2520;--tx:#e8efea;--mu:#93a49a;--ac:#3ec9a0;--ac2:#1f3a30;--bd:#2c3b34;--ok:#3ec9a0;--warn:#e0a94a;--bad:#ef6b5b;--tg:#ef6b5b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1a2520;--tx:#e8efea;--mu:#93a49a;--ac:#3ec9a0;--ac2:#1f3a30;--bd:#2c3b34;--ok:#3ec9a0;--warn:#e0a94a;--bad:#ef6b5b;--tg:#ef6b5b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 18px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input[type=text],input[type=number]{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}
.status{border-radius:12px;padding:14px;background:var(--ac2)}
.status b{font-size:20px}.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;border-radius:9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{border:1px solid var(--bd);border-radius:10px;padding:10px}.kpi small{color:var(--mu);display:block;font-size:12px}.kpi b{font-size:17px}
.sug{display:grid;gap:10px}.sug div{border-left:4px solid var(--ac);background:var(--bg);padding:10px 12px;border-radius:0 10px 10px 0}
.sug b{display:block}.sug span{color:var(--mu);font-size:13px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}
svg{width:100%;height:auto;display:block}.note{font-size:12px;color:var(--mu)}
details summary{cursor:pointer;color:var(--ac)}
.f{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mu);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<h1>🎯 目標理財規劃器</h1>
<p class="sub">設定一個財務目標,用 PV(現值)、FV(未來值)、PMT(每期投入)算出你離目標還有多遠,以及怎麼補足。</p>
<div class="grid">
<div>
<div class="card">
<h2>① 選擇目標</h2>
<div class="chips" id="chips"></div>
<label>目標名稱</label><input type="text" id="name">
<label>目標金額(今日購買力,NT$)</label><input type="number" id="target" min="0" step="10000">
<div class="row"><div><label>達成年限(年)</label><input type="number" id="years" min="1" max="60"></div>
<div><label>通膨率 %/年</label><input type="number" id="infl" min="0" max="15" step="0.1"></div></div>
<div class="chk"><input type="checkbox" id="useInfl" checked><span>目標金額依通膨調整(建議開啟)</span></div>
</div>
<div class="card">
<h2>② 目前條件</h2>
<label>目前已備資金 PV(NT$)</label><input type="number" id="pv" min="0" step="10000">
<label>每月可投入 PMT(NT$)</label><input type="number" id="pmt" min="0" step="1000">
<label>預期年化報酬率 %</label><input type="number" id="ret" min="0" max="30" step="0.1">
<p class="note">月複利、期末投入。報酬率僅為假設,實際會波動。</p>
</div>
</div>
<div id="out"></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const PRE={
 retire:{name:'退休金',target:15000000,years:30,infl:2,ret:5,pv:800000,pmt:15000},
 house:{name:'購屋頭期款',target:3000000,years:7,infl:2,ret:3.5,pv:300000,pmt:25000},
 edu:{name:'子女教育金',target:2000000,years:12,infl:3,ret:4.5,pv:100000,pmt:8000},
 trip:{name:'夢想旅行',target:300000,years:3,infl:2,ret:2,pv:20000,pmt:7000},
 emerg:{name:'緊急預備金',target:600000,years:2,infl:1.5,ret:1.5,pv:50000,pmt:20000}
};
const LBL={retire:'🌴 退休',house:'🏠 購屋',edu:'🎓 教育',trip:'✈️ 旅行',emerg:'🛟 預備金'};
const F=['name','target','years','infl','ret','pv','pmt'];
const fmt=n=>'NT$ '+Math.round(n).toLocaleString('zh-TW');
const pct=n=>(n*100).toFixed(1)+'%';
// 核心財務函數(月複利)
function FV(pv,pmt,r,n){if(r===0)return pv+pmt*n;const g=Math.pow(1+r,n);return pv*g+pmt*(g-1)/r}
function PMT(T,pv,r,n){const g=Math.pow(1+r,n),need=T-pv*g;if(need<=0)return 0;return r===0?need/n:need*r/(g-1)}
function PVreq(T,r,n){return T/Math.pow(1+r,n)}
function yearsNeeded(T,pv,pmt,r){let b=pv;for(let m=1;m<=1200;m++){b=b*(1+r)+pmt;if(b>=T)return m/12}return null}
function rateNeeded(T,pv,pmt,n){let lo=0,hi=0.3;if(FV(pv,pmt,hi/12,n)<T)return null;for(let i=0;i<50;i++){const m=(lo+hi)/2;FV(pv,pmt,m/12,n)>=T?hi=m:lo=m}return hi}

function val(id){return parseFloat($(id).value)||0}
function save(){try{localStorage.setItem('fp',JSON.stringify(Object.fromEntries(F.map(k=>[k,$(k).value]))))}catch(e){}}
function setVals(o){F.forEach(k=>$(k).value=o[k])}

function calc(){
 const y=Math.max(1,val('years')),n=Math.round(y*12),i=val('infl')/100,ra=val('ret')/100,r=ra/12;
 const T0=val('target'),pv=val('pv'),pmt=val('pmt');
 const T=$('useInfl').checked?T0*Math.pow(1+i,y):T0;
 const proj=FV(pv,pmt,r,n),gap=T-proj,ratio=T>0?proj/T:0;
 const reqP=PMT(T,pv,r,n),reqPV=PVreq(T,r,n);
 const color=ratio>=1?'var(--ok)':ratio>=.7?'var(--warn)':'var(--bad)';
 const tag=ratio>=1?'✅ 目標可達成':ratio>=.7?'⚠️ 接近目標,需微調':'🚨 落後目標,需要調整';
 // 建議
 const S=[];
 if(ratio>=1){S.push(['保持現狀,並留意風險','依目前條件預計超出目標 '+fmt(proj-T)+'。可考慮降低風險資產比重,或把多出的部分提前做下一個目標。'])}
 else{
  S.push(['① 提高每月投入至 '+fmt(reqP),'比現在多 '+fmt(reqP-pmt)+'/月(+'+(pmt>0?Math.round((reqP/pmt-1)*100):'∞')+'%)。這是最可控的槓桿。']);
  const yn=yearsNeeded(T0*($('useInfl').checked?1:1)*1,pv,pmt,r);
  const yn2=(function(){let b=pv;for(let m=1;m<=1200;m++){b=b*(1+r)+pmt;const t=$('useInfl').checked?T0*Math.pow(1+i,m/12):T0;if(b>=t)return m/12}return null})();
  S.push(['② 延長年限'+(yn2?'至 '+yn2.toFixed(1)+' 年':''),yn2?'維持目前投入,多等 '+(yn2-y).toFixed(1)+' 年即可達標(已計入通膨)。':'以目前投入,即使延長到 100 年也難達標,請先提高投入。']);
  const rn=rateNeeded(T,pv,pmt,n);
  S.push(['③ 提高報酬率'+(rn?'至 '+pct(rn):''),rn?(rn>0.08?'需要的報酬率偏高,風險大,不建議只靠這一招。':'在合理範圍內,但要接受較大波動。'):'即使 30% 報酬也無法達標,請調整其他條件。']);
  const aff=proj/($('useInfl').checked?Math.pow(1+i,y):1);
  S.push(['④ 調降目標至 '+fmt(aff),'以今日購買力計算,這是目前條件能累積的金額。']);
  S.push(['⑤ 或一次投入 '+fmt(reqPV),'若有一筆閒置資金,現在一次投入這筆就能達標(即 PV)。']);
 }
 // 圖表
 const W=600,H=250,pad=40,ymax=Math.max(T,proj,PV_path(reqP))*1.08;
 function PV_path(p){return FV(pv,p,r,n)}
 const X=m=>pad+(W-pad-10)*m/n,Y=v=>H-24-(H-44)*v/ymax;
 const path=p=>{let d='';for(let m=0;m<=n;m+=Math.max(1,Math.floor(n/60))){d+=(d?'L':'M')+X(m).toFixed(1)+','+Y(FV(pv,p,r,m)).toFixed(1)}d+='L'+X(n)+','+Y(FV(pv,p,r,n));return d};
 let ticks='';for(let k=0;k<=y;k+=Math.ceil(y/6))ticks+=`<text x="${X(k*12)}" y="${H-6}" font-size="11" fill="var(--mu)" text-anchor="middle">${k}年</text>`;
 const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="資產成長圖">
 <line x1="${pad}" y1="${Y(0)}" x2="${W-10}" y2="${Y(0)}" stroke="var(--bd)"/>
 <line x1="${pad}" y1="${Y(T)}" x2="${W-10}" y2="${Y(T)}" stroke="var(--tg)" stroke-dasharray="5 4"/>
 <text x="${pad+4}" y="${Y(T)-5}" font-size="11" fill="var(--tg)">目標 ${fmt(T)}</text>
 ${ratio<1?`<path d="${path(reqP)}" fill="none" stroke="var(--ok)" stroke-width="2" stroke-dasharray="2 4"/>`:''}
 <path d="${path(pmt)}" fill="none" stroke="var(--ac)" stroke-width="3"/>${ticks}</svg>
 <p class="note">實線:目前計畫;綠色點線:達標所需計畫;紅色虛線:目標金額。</p>`;
 // 情境
 const sc=[[-2,'保守'],[0,'基準'],[2,'樂觀']].map(([d,t])=>{const rr=Math.max(0,ra*100+d)/1200,f=FV(pv,pmt,rr,n);return `<tr><td>${t}(${Math.max(0,ra*100+d).toFixed(1)}%)</td><td>${fmt(f)}</td><td style="color:${f>=T?'var(--ok)':'var(--bad)'}">${pct(f/T)}</td><td>${fmt(PMT(T,pv,rr,n))}</td></tr>`}).join('');
 // 年度表
 let rows='';for(let k=1;k<=y;k++){const m=k*12,b=FV(pv,pmt,r,m),c=pv+pmt*m;rows+=`<tr><td>第 ${k} 年</td><td>${fmt(c)}</td><td>${fmt(b-c)}</td><td>${fmt(b)}</td></tr>`}
 $('out').innerHTML=`
 <div class="card"><div class="status" style="border-left:6px solid ${color}"><b>${tag}</b>
 <div class="bar"><i style="width:${Math.min(100,ratio*100)}%;background:${color}"></i></div>
 <span>「${$('name').value||'目標'}」預計達成率 <b style="font-size:inherit">${pct(ratio)}</b>(${y} 年後)</span></div>
 <div class="kpis">
 <div class="kpi"><small>目標金額(${$('useInfl').checked?'含通膨 FV':'FV'})</small><b>${fmt(T)}</b></div>
 <div class="kpi"><small>目前計畫預計 FV</small><b>${fmt(proj)}</b></div>
 <div class="kpi"><small>${gap>0?'資金缺口':'超出目標'}</small><b style="color:${gap>0?'var(--bad)':'var(--ok)'}">${fmt(Math.abs(gap))}</b></div>
 <div class="kpi"><small>所需每月投入 PMT</small><b>${fmt(reqP)}</b></div>
 <div class="kpi"><small>所需一次投入 PV</small><b>${fmt(reqPV)}</b></div>
 <div class="kpi"><small>投入本金 / 投資收益</small><b>${fmt(pv+pmt*n)} / ${fmt(Math.max(0,proj-pv-pmt*n))}</b></div></div></div>
 <div class="card"><h2>資產成長曲線</h2>${svg}</div>
 <div class="card"><h2>💡 行動建議</h2><div class="sug">${S.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></div>
 <div class="card"><h2>報酬率情境分析</h2><div class="scroll"><table><tr><th>情境</th><th>預計 FV</th><th>達成率</th><th>所需 PMT</th></tr>${sc}</table></div></div>
 <div class="card"><details><summary>年度明細表</summary><div class="scroll"><table><tr><th>年度</th><th>累計本金</th><th>累計收益</th><th>資產總額</th></tr>${rows}</table></div></details></div>
 <div class="card f"><b>使用的公式</b><br>r = 年報酬率 ÷ 12,n = 年數 × 12<br>FV = PV·(1+r)ⁿ + PMT·[(1+r)ⁿ − 1] ÷ r<br>PMT = (目標 − PV·(1+r)ⁿ)·r ÷ [(1+r)ⁿ − 1]<br>PV = 目標 ÷ (1+r)ⁿ<br>通膨調整後目標 = 目標 × (1+通膨率)^年數</div>
 <p class="note">本工具僅供試算與教育用途,不構成投資建議;報酬率為假設值,實際結果可能不同。</p>`;
 save();
}
$('chips').innerHTML=Object.keys(PRE).map(k=>`<button class="chip" data-k="${k}">${LBL[k]}</button>`).join('');
$('chips').onclick=e=>{const k=e.target.dataset.k;if(k){setVals(PRE[k]);calc()}};
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',calc));
let init=PRE.retire;try{const s=JSON.parse(localStorage.getItem('fp'));if(s&&s.target)init=s}catch(e){}
setVals(init);calc();
</script>
</body>
</html>
